<script>
    const FORMSPREE_LINK = "https://formspree.io";

    const s1 = document.getElementById('screen1');
    const s2 = document.getElementById('screen2');
    const s3 = document.getElementById('screen3');
    const s4 = document.getElementById('screen4');
    
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const nextToCalendar = document.getElementById('nextToCalendar');
    const finalSubmitBtn = document.getElementById('finalSubmitBtn');
    const dtInput = document.getElementById('date');

    let chosenType = "";

    // Disable past dates in calendar
    dtInput.min = new Date().toISOString().split('T')[0];

    // Helper function to switch screens cleanly
    function showScreen(screenToShow) {
        [s1, s2, s3, s4].forEach(s => s.classList.remove('active'));
        screenToShow.classList.add('active');
    }

    // Screen 1: YES Button
    yesBtn.onclick = function() {
        showScreen(s2);
    };

    // Screen 1: NO Button
    noBtn.onclick = function() {
        let fd = new FormData();
        fd.append('decision', 'No');
        fetch(FORMSPREE_LINK, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
        alert("Response recorded. Thank you.");
    };

    // Screen 2: Next Button
    nextToCalendar.onclick = function() {
        let rDinner = document.getElementById('radioDinner');
        let rMovie = document.getElementById('radioMovie');
        
        if (rDinner.checked) { 
            chosenType = rDinner.value; 
        } else if (rMovie.checked) { 
            chosenType = rMovie.value; 
        } else { 
            alert("Please pick an option first! 💕"); 
            return; 
        }
        
        showScreen(s3);
    };

    // Screen 3: Submit Button
    finalSubmitBtn.onclick = function() {
        if (!dtInput.value) {
            alert("Please select a date on the calendar! 📅");
            return;
        }
        
        let fd = new FormData();
        fd.append('decision', 'Yes');
        fd.append('style', chosenType);
        fd.append('_date', dtInput.value);
        
        fetch(FORMSPREE_LINK, {
            method: 'POST',
            body: fd,
            headers: { 'Accept': 'application/json' }
        })
        .then(() => showScreen(s4))
        .catch(() => showScreen(s4));
    };
</script>
