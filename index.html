<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%), 
                        radial-gradient(circle at 10% 20%, rgba(255, 194, 209, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(194, 223, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 440px;
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
        }

        .screen {
            display: none;
            width: 100%;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            height: 70px;
            position: relative;
            width: 100%;
        }

        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.25);
            z-index: 5;
        }

        #noBtn {
            background: #f7fafc;
            color: #718096;
            border: 1px solid #e2e8f0;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 28px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-card {
            position: relative;
        }

        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .option-label {
            display: block;
            padding: 15px 10px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            text-align: center;
        }

        .option-card input[type="radio"]:checked + .option-label {
            background: #ff4d6d;
            border-color: #ff4d6d;
            color: white;
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.2);
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            color: #2d3748;
            font-size: 15px;
            outline: none;
        }

        .submit-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.25);
        }

        .success-icon {
            font-size: 54px;
            margin-bottom: 20px;
        }
        
        .success-text {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SCREEN 1: THE ASK -->
        <div id="screen1" class="screen active">
            <h1>Will you go on a date with me? ❤️</h1>
            <div class="btn-container">
                <button type="button" class="btn" id="yesBtn">YES</button>
                <button type="button" class="btn" id="noBtn">NO</button>
            </div>
        </div>

        <!-- SCREEN 2: DATE OPTIONS -->
        <div id="screen2" class="screen">
            <h1>Where would you like to go? ✨</h1>
            <div class="options-grid">
                <div class="option-card">
                    <input type="radio" name="DateType" value="Dinner Date" required>
                    <span class="option-label">🍽️ Dinner Date</span>
                </div>
                <div class="option-card">
                    <input type="radio" name="DateType" value="Movie Date">
                    <span class="option-label">🎬 Movie Date</span>
                </div>
                <div class="option-card">
                    <input type="radio" name="DateType" value="Long Drive & Food">
                    <span class="option-label">🚗 Long Drive & Food</span>
                </div>
                <div class="option-card">
                    <input type="radio" name="DateType" value="Cafe Hopping">
                    <span class="option-label">☕ Cafe Hopping</span>
                </div>
            </div>
            <button type="button" class="submit-btn" id="nextToCalendar">Next Step ➡️</button>
        </div>

        <!-- SCREEN 3: CALENDAR -->
        <div id="screen3" class="screen">
            <h1>Pick a perfect day 📅</h1>
            <form id="dateForm">
                <div class="form-group">
                    <label for="date">Select a day on the calendar:</label>
                    <input type="date" id="date" name="Calendar Date" required>
                </div>
                <button type="submit" class="submit-btn">Complete Reservation ✨</button>
            </form>
        </div>

        <!-- SCREEN 4: SUCCESS -->
        <div id="screen4" class="screen">
            <div class="success-icon">🥰</div>
            <h1>It's officially a date!</h1>
            <p class="success-text">Your choices have been sent directly to me. Looking forward to it!</p>
        </div>

    </div>

    <script>
        const FORMSPREE_LINK = "https://formspree.io";

        const s1 = document.getElementById('screen1');
        const s2 = document.getElementById('screen2');
        const s3 = document.getElementById('screen3');
        const s4 = document.getElementById('screen4');
        
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const nextToCalendar = document.getElementById('nextToCalendar');
        const dateForm = document.getElementById('dateForm');

        let chosenType = "";

        yesBtn.onclick = function() {
            s1.style.display = "none";
            s2.style.display = "block";
        };

        noBtn.onclick = function() {
            let fd = new FormData();
            fd.append('Decision', 'No');
            
            fetch(FORMSPREE_LINK, {
                method: 'POST',
                body: fd,
                headers: { 'Accept': 'application/json' }
            });
            
            alert("Response recorded. Thank you.");
        };

        nextToCalendar.onclick = function() {
            let radios = document.getElementsByName('DateType');
            let selected = false;
            for(let r of radios) {
                if(r.checked) {
                    chosenType = r.value;
                    selected = true;
                    break;
                }
            }
            if(!selected) {
                alert("Please pick an option first! ✨");
                return;
            }
            s2.style.display = "none";
            s3.style.display = "block";
        };

        const dtInput = document.getElementById('date');
        dtInput.min = new Date().toISOString().split('T')[0];

        dateForm.onsubmit = function(e) {
            e.preventDefault();
            
            let fd = new FormData();
            fd.append('Decision', 'Yes');
            fd.append('Chosen Style', chosenType);
            fd.append('Calendar Date', dtInput.value);
            
            fetch(FORMSPREE_LINK, {
                method: 'POST',
                body: fd,
                headers: { 'Accept': 'application/json' }
            }).then(() => {
                s3.style.display = "none";
                s4.style.display = "block";
            }).catch(() => {
                s3.style.display = "none";
                s4.style.display = "block";
            });
        };
    </script>
</body>
</html>
