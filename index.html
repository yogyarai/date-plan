<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* Screen Controls */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Screen 1: Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            height: 80px;
            position: relative;
        }

        .btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            background: #ff758f;
            transform: scale(1.05);
        }

        #noBtn {
            background: #e0e0e0;
            color: #555;
            position: absolute;
            z-index: 10;
        }

        /* Screen 2: Form Choices */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-card {
            position: relative;
        }

        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .option-label {
            display: block;
            padding: 15px 10px;
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            text-align: center;
        }

        .option-card input[type="radio"]:checked + .option-label {
            background: #ff4d6d;
            border-color: #ff4d6d;
            color: white;
            transform: scale(1.03);
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            background: #fff0f3;
            color: #4a4a4a;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        input[type="date"]:focus {
            border-color: #ff4d6d;
        }

        button[type="submit"] {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, background 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: #ff758f;
            transform: translateY(-2px);
        }

        /* Screen 3: Success */
        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .success-text {
            color: #4a4a4a;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SCREEN 1: THE ASK -->
        <div id="screen1" class="screen active">
            <h1>Will you go on a date with me? ❤️</h1>
            <div class="btn-container">
                <button type="button" class="btn" id="yesBtn">YES</button>
                <button type="button" class="btn" id="noBtn">NO</button>
            </div>
        </div>

        <!-- SCREEN 2: THE DETAILS -->
        <div id="screen2" class="screen">
            <h1>Yay! Let's plan our date 🌸</h1>
            
            <!-- Replace the action URL with your real Formspree endpoint URL -->
            <form action= "https://formspree.io/f/mqergqpy" method="POST" id="dateForm">
                
                <!-- Food Selection -->
                <div class="form-group">
                    <label>What are we eating?</label>
                    <div class="options-grid">
                        <div class="option-card">
                            <input type="radio" name="Food" value="Sushi" required>
                            <span class="option-label">🍣 Sushi</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Food" value="Pizza">
                            <span class="option-label">🍕 Pizza</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Food" value="Burgers">
                            <span class="option-label">🍔 Burgers</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Food" value="Dessert">
                            <span class="option-label">🍦 Dessert Cafe</span>
                        </div>
                    </div>
                </div>

                <!-- Movie / Activity Selection -->
                <div class="form-group">
                    <label>What are we watching / doing?</label>
                    <div class="options-grid">
                        <div class="option-card">
                            <input type="radio" name="Activity" value="Rom-Com" required>
                            <span class="option-label">🎬 Rom-Com</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Activity" value="Horror Movie">
                            <span class="option-label">🍿 Horror Movie</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Activity" value="Arcade">
                            <span class="option-label">🕹️ Arcade Games</span>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="Activity" value="Bowling">
                            <span class="option-label">🎳 Bowling Alley</span>
                        </div>
                    </div>
                </div>

                <!-- Date Selection -->
                <div class="form-group">
                    <label for="date">Pick a day on the calendar:</label>
                    <input type="date" id="date" name="Date" required>
                </div>

                <button type="submit">Lock It In! 📅</button>
            </form>
        </div>

        <!-- SCREEN 3: SUCCESS CONFIRMATION -->
        <div id="screen3" class="screen">
            <div class="success-icon">✨ See You Soon! ✨</div>
            <h1>It's officially a date! 🥰</h1>
            <p class="success-text">Your choices have been sent directly to me. I can't wait to see you!</p>
        </div>

    </div>

    <script>
        // Screen Navigation
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const dateForm = document.getElementById('dateForm');

        // Initial positions for NO button relative positioning
        noBtn.style.left = '140px';
        noBtn.style.top = '15px';

        // Yes Button click moves to choices form
        yesBtn.addEventListener('click', () => {
            screen1.classList.remove('active');
            screen2.classList.add('active');
        </script>
        
        <script>
        // The Fun Dodge Mechanic for the NO Button (Works on Touch or Hover)
        function dodgeButton() {
            const container = document.querySelector('.btn-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            // Generate random bounds within the container


          const newX = Math.floor(Math.random() * (containerWidth - noBtn.clientWidth));const newY = Math.floor(Math.random() * (containerHeight - noBtn.clientHeight));noBtn.style.left = ${newX}px;noBtn.style.top = ${newY}px;}noBtn.addEventListener('mouseenter', dodgeButton);noBtn.addEventListener('touchstart', (e) => {e.preventDefault(); // Prevents clicking on mobile touch tapdodgeButton();});// Set calendar to disable past datesconst dateInput = document.getElementById('date');const today = new Date().toISOString().split('T')[0];dateInput.min = today;// Custom handling for Form submission to route to Screen 3 seamlesslydateForm.addEventListener('submit', function(e) {e.preventDefault();const formData = new FormData(dateForm);// Sends form to Formspree silently in the backgroundfetch(dateForm.action, {method: 'POST',body: formData,headers: {'Accept': 'application/json'}}).then(response => {if (response.ok) {screen2.classList.remove('active');screen3.classList.add('active');} else {alert('Oops! Something went wrong submitting your choices. Please try again.');}}).catch(error => {// Fallback just in case network errors outscreen2.classList.remove('active');screen3.classList.add('active');});});
